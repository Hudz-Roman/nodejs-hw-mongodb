tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '380440000000'
          email:
            description: "Contact's email"
            type: string
            example: email@email.com
          isFavourite:
            description: 'Favourite contact'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Upload contact's photo"
            type: string
            format: binary
responses:
  '201':
    $ref: '../../components/responses/201.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
